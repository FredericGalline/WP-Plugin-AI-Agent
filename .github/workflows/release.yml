name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(git describe --abbrev=0 --tags | sed 's/^v//')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update plugin version in file
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          sed -i "s/Version:.*$/Version: $VERSION/" ai-connector.php
          sed -i "s/define('AI_CONNECTOR_VERSION'.*/define('AI_CONNECTOR_VERSION', '$VERSION');/" ai-connector.php

      - name: Create plugin archive
        run: |
          mkdir -p build/ai-connector

          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='.claude' \
                    --exclude='node_modules' \
                    --exclude='tests' \
                    --exclude='/build' \
                    --exclude='.gitignore' \
                    --exclude='.gitattributes' \
                    --exclude='composer.json' \
                    --exclude='composer.lock' \
                    --exclude='phpunit.xml.dist' \
                    --exclude='*.md' \
                    . build/ai-connector/

          if [ ! -d "build/ai-connector/vendor/yahnis-elsts" ]; then
            echo "ERROR: Plugin Update Checker not found in vendor!"
            exit 1
          fi

          cd build
          zip -r ai-connector-${{ steps.get_version.outputs.VERSION }}.zip ai-connector/

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: v${{ steps.get_version.outputs.VERSION }}
          files: build/ai-connector-${{ steps.get_version.outputs.VERSION }}.zip
          body: |
            ## Version ${{ steps.get_version.outputs.VERSION }}

            ### Changements
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Installation
            1. Telechargez le fichier ZIP ci-dessous
            2. Uploadez-le dans WordPress via Extensions > Ajouter
            3. Activez le plugin

            ### Mise a jour
            WordPress detectera automatiquement cette nouvelle version dans votre tableau de bord.

            ### Configuration depot prive
            ```php
            define('AI_CONNECTOR_GITHUB_TOKEN', 'votre_token_github');
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
